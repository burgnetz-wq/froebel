<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lernkarten NS-Außenpolitik 1933–1939</title><style>:root{font-family:Arial,Helvetica,sans-serif;color:#18243a;background:#edf2f8}body{margin:0}main{max-width:900px;margin:28px auto;padding:0 18px}h1{font-size:clamp(24px,4vw,38px);margin-bottom:6px}p{line-height:1.45}.toolbar,.nav,.foot{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.toolbar{margin:20px 0}.toolbar button{background:white;color:#143253;border:1px solid #b6c5d4}.toolbar button.active{background:#124c80;color:white}button{font:inherit;padding:11px 16px;border-radius:9px;cursor:pointer;border:0;background:#155b98;color:white}button:hover{filter:brightness(.93)}.card{min-height:300px;background:white;box-shadow:0 8px 24px #1834591c;border:1px solid #cfd9e5;border-radius:18px;padding:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer}.card strong{font-size:clamp(21px,3vw,28px);line-height:1.4}.eyebrow{font-size:13px;letter-spacing:.1em;color:#5a718a;text-transform:uppercase}.sub{color:#596c81;font-size:14px}.nav{justify-content:space-between;margin:16px 0}.foot{justify-content:space-between;margin-top:15px}.foot label{cursor:pointer}progress{width:100%;height:12px;accent-color:#28865b}#counter{font-weight:bold}button.secondary{background:#dbe5f0;color:#183c61}@media print{.toolbar,.nav,.foot,.sub,progress{display:none!important}.card{box-shadow:none;break-inside:avoid;min-height:unset;height:auto}main{max-width:100%}}</style></head><body><main><h1>NS-Außenpolitik 1933–1939</h1><p>Ziele · Schritte · Reaktionen · Folgen — 16 interaktive Lernkarten. Klicke auf die Karte, um die Antwort anzuzeigen.</p><div class="toolbar" id="filters"></div><progress id="progress" max="16" value="0"></progress><p class="sub"><span id="knownCount">0</span> von 16 Karten gelernt · <span id="counter"></span></p><section class="card" id="card" tabindex="0" role="button" aria-label="Lernkarte umdrehen"><div class="eyebrow" id="type"></div><strong id="content"></strong><p class="sub">Anklicken oder Eingabetaste: Karte umdrehen</p></section><div class="nav"><button class="secondary" id="back">← Zurück</button><button id="next">Nächste Karte →</button></div><div class="foot"><label><input type="checkbox" id="learned"> Diese Karte kann ich</label><button class="secondary" id="reset">Neustart</button></div></main><script>
const cards=[
['Ziele','Welche drei grundlegenden Ziele verfolgte Hitler mit seiner Außenpolitik?','Revision des Versailler Vertrags, Zusammenfassung aller Deutschen in einem Reich und Eroberung von „Lebensraum“ im Osten Europas.'],
['Ziele','Was bedeutete die Revision des Versailler Vertrags?','Hitler wollte die militärischen Beschränkungen und territorialen Bestimmungen des Vertrags von 1919 beseitigen.'],
['Schritte','Warum trat Deutschland 1933 aus dem Völkerbund aus?','Das NS-Regime wollte sich der internationalen Kontrolle entziehen und seine Aufrüstung ohne die Beschränkungen des Völkerbundes vorantreiben.'],
['Schritte','Was geschah 1935 im Saargebiet?','Nach einer Volksabstimmung im Januar 1935 wurde das Saargebiet am 1. März wieder in das Deutsche Reich eingegliedert.'],
['Schritte','Was verstieß 1935 gegen den Versailler Vertrag?','Die Wiedereinführung der allgemeinen Wehrpflicht und der offene Aufbau einer stark vergrößerten Wehrmacht einschließlich der Luftwaffe.'],
['Schritte','Was geschah bei der Rheinlandbesetzung 1936?','Am 7. März ließ Hitler deutsche Truppen in die entmilitarisierte Rheinlandzone einmarschieren. Das verletzte den Versailler Vertrag und die Locarno-Verträge.'],
['Schritte','Wie unterstützte das NS-Regime Franco im Spanischen Bürgerkrieg?','Deutschland lieferte Flugzeuge, Waffen und Soldaten, darunter die Legion Condor. Diese beteiligte sich 1937 an der Bombardierung Guernicas.'],
['Schritte','Was geschah beim sogenannten Anschluss Österreichs im März 1938?','Unter massivem nationalsozialistischem Druck marschierte die Wehrmacht am 12. März in Österreich ein. Österreich wurde dem Deutschen Reich eingegliedert.'],
['Schritte','Was wurde im Münchner Abkommen 1938 beschlossen?','Deutschland durfte die sudetendeutschen Gebiete der Tschechoslowakei übernehmen. Großbritannien, Frankreich, Italien und Deutschland beschlossen dies ohne Beteiligung der Tschechoslowakei.'],
['Schritte','Was geschah im März 1939 mit den böhmischen Ländern?','Die Wehrmacht besetzte die verbliebenen tschechischen Gebiete. Das NS-Regime errichtete das Protektorat Böhmen und Mähren. Die Slowakei wurde ein von Deutschland abhängiger Staat.'],
['Schritte','Was geschah im März 1939 mit dem Memelland?','Litauen musste das Memelland unter deutschem Druck abtreten. Es wurde in das Deutsche Reich eingegliedert.'],
['Schritte','Was vereinbarten Deutschland und die Sowjetunion im August 1939?','Den deutsch-sowjetischen Nichtangriffspakt (Hitler-Stalin-Pakt). Ein geheimes Zusatzprotokoll teilte Teile Osteuropas in deutsche und sowjetische Interessensphären auf.'],
['Schritte','Welches Ereignis löste am 1. September 1939 den Zweiten Weltkrieg in Europa aus?','Der deutsche Überfall auf Polen. Am 3. September erklärten Großbritannien und Frankreich Deutschland den Krieg.'],
['Reaktionen','Was versteht man unter der Appeasement-Politik Großbritanniens?','Die Politik, Hitler durch Zugeständnisse zu beschwichtigen und einen Krieg zu vermeiden. Ein bekanntes Beispiel ist das Münchner Abkommen von 1938.'],
['Reaktionen','Wie reagierten Großbritannien und Frankreich nach dem Überfall auf Polen?','Beide Staaten erklärten Deutschland am 3. September 1939 den Krieg, nachdem das Deutsche Reich den Angriff nicht eingestellt hatte.'],
['Folgen','Welche Folgen hatte die NS-Außenpolitik bis September 1939?','Gebietsvergrößerungen durch Annexionen und Eroberungen, die Zerschlagung der Tschechoslowakei, die Aufteilung Polens durch Deutschland und die Sowjetunion und der Beginn des Zweiten Weltkriegs in Europa.']];
let category='Alle',index=0,flipped=false;const known=new Set(),categories=['Alle','Ziele','Schritte','Reaktionen','Folgen'];const el=id=>document.getElementById(id);function selected(){return cards.map((c,i)=>({c,i})).filter(o=>category==='Alle'||o.c[0]===category)}function render(){let list=selected();index=(index+list.length)%list.length;const {c,i}=list[index];el('type').textContent=c[0]+' · '+(flipped?'Antwort':'Frage');el('content').textContent=c[flipped?2:1];el('counter').textContent='Karte '+(index+1)+' von '+list.length;el('knownCount').textContent=known.size;el('progress').value=known.size;el('learned').checked=known.has(i);el('filters').innerHTML='';categories.forEach(cat=>{const b=document.createElement('button');b.textContent=cat;b.className=cat===category?'active':'';b.onclick=()=>{category=cat;index=0;flipped=false;render()};el('filters').appendChild(b)})}function turn(){flipped=!flipped;render()}el('card').onclick=turn;el('card').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();turn()}};el('next').onclick=()=>{index++;flipped=false;render()};el('back').onclick=()=>{index--;flipped=false;render()};el('learned').onchange=e=>{const i=selected()[index].i;e.target.checked?known.add(i):known.delete(i);render()};el('reset').onclick=()=>{known.clear();category='Alle';index=0;flipped=false;render()};render();
</script></body></html>
