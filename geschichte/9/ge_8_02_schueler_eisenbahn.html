<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Die Eisenbahn – Motor der Industrialisierung</title>
<style>
:root{
  --paper:#f5efe4; --card:#fffdf8; --ink:#1f1d1a; --muted:#5b554c; --line:#d9cfbf;
  --steel:#24445c; --steel-2:#e3ecf2; --rust:#a4441c; --rust-2:#f7e3d8;
  --ok:#1e6b34; --ok-bg:#dcf2e1; --bad:#9b1c1c; --bad-bg:#fbe0e0; --sel:#fff1b8;
  --r:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:74px}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 "Segoe UI",Arial,Helvetica,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1060px;margin:0 auto;padding:0 16px}
header.top{background:var(--steel);color:#fff;padding:26px 0 22px;border-bottom:6px solid var(--rust)}
header.top .kicker{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85;margin:0 0 4px}
header.top h1{margin:0 0 6px;font-size:clamp(1.6rem,4vw,2.3rem);line-height:1.15}
header.top .meta{margin:0;opacity:.9}
.lead{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin:18px 0 6px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.leitfrage{border-left:6px solid var(--rust);font-size:1.12rem}
.leitfrage b{display:block;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--rust)}
.box h3{margin:0 0 6px;font-size:1rem}
.box ul{margin:0;padding-left:1.2em}
nav.path{position:sticky;top:0;z-index:20;background:rgba(245,239,228,.96);backdrop-filter:blur(4px);border-bottom:1px solid var(--line)}
nav.path .wrap{display:flex;gap:8px;align-items:center;overflow-x:auto;padding-top:9px;padding-bottom:9px}
.chip{flex:0 0 auto;border:2px solid var(--steel);background:#fff;border-radius:999px;padding:6px 12px;min-height:44px;font-size:.92rem;white-space:nowrap}
.chip.done{background:var(--ok-bg);border-color:var(--ok)}
.chip.done::after{content:" ✓";color:var(--ok);font-weight:700}
.progress{flex:0 0 auto;margin-left:auto;font-size:.9rem;color:var(--muted);padding-left:8px}
.bar{height:6px;background:var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .4s}
section.station{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px 20px;margin:20px 0;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.st-head{display:flex;gap:12px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.st-nr{width:40px;height:40px;border-radius:50%;background:var(--steel);color:#fff;display:grid;place-items:center;font-weight:700;flex:0 0 auto}
.st-head h2{margin:0;font-size:1.3rem;flex:1 1 auto}
.st-type{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;background:var(--steel-2);color:var(--steel);padding:3px 9px;border-radius:999px}
.readable p{margin:.5em 0}
.task{background:var(--rust-2);border-radius:10px;padding:10px 14px;margin:12px 0;font-weight:600}
.task::before{content:"Aufgabe: ";color:var(--rust)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.btn{border:2px solid var(--steel);background:#fff;border-radius:12px;padding:9px 14px;min-height:46px}
.btn.primary{background:var(--steel);color:#fff}
.btn.small{min-height:40px;padding:6px 11px;font-size:.92rem}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible,.item:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
.gl{border:0;background:none;padding:0;color:var(--steel);font-weight:700;text-decoration:underline dotted 2px;text-underline-offset:3px}
.fb{min-height:1.4em;margin:8px 0 0;font-weight:600}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
blockquote.quelle{margin:12px 0;padding:10px 16px;background:#fbf7ef;border-left:5px solid var(--steel);border-radius:0 10px 10px 0;font-family:Georgia,"Times New Roman",serif}
blockquote.quelle cite{display:block;font-size:.85rem;color:var(--muted);font-style:normal;margin-top:4px;font-family:inherit}
/* Galerie, Bildwahl, Hotspot */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:10px 0}
.gallery figure.pic{margin:0}
.ki{display:inline-block;background:#3b2a5a;color:#fff;font-size:.7rem;font-weight:700;letter-spacing:.05em;padding:1px 7px;border-radius:999px;margin-right:6px;vertical-align:1px}
.bopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.bopt{border:3px solid var(--line);background:#fff;border-radius:10px;padding:0;overflow:hidden;text-align:center}
.bopt img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#eee}
.bopt span{display:block;font-size:.85rem;padding:4px 6px}
.bopt.ok{border-color:var(--ok);background:var(--ok-bg)} .bopt.bad{border-color:var(--bad);background:var(--bad-bg)}
.hs-wrap{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start}
.hs{position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--steel);cursor:crosshair;background:#ddd;aspect-ratio:1408/768}
.hs img{display:block;width:100%;height:100%;object-fit:cover}
.hs .mark{position:absolute;border:3px solid #16c45a;border-radius:8px;background:rgba(22,196,90,.18);pointer-events:none}
.hs .mark span{position:absolute;left:0;top:-1.6em;background:#16c45a;color:#fff;font-size:.72rem;font-weight:700;padding:0 6px;border-radius:5px;white-space:nowrap}
.hs .mark.tip{border-color:#f2c200;background:rgba(242,194,0,.25);border-style:dashed}
.hs .dot{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:3px solid var(--bad);pointer-events:none;animation:fade 1s forwards}
@keyframes fade{to{opacity:0;transform:scale(2)}}
.hs-list{display:flex;flex-direction:column;gap:6px}
.hs-list .item.cur{background:var(--sel);border-color:var(--rust)}
.hs-find{font-size:1.1rem;font-weight:700;color:var(--rust);margin:0 0 6px}
/* visueller Hefteintrag */
.tb{font-family:"Segoe UI",Arial,sans-serif;line-height:1.35;margin:6px 0 10px}
.tb-title{font-weight:800;font-size:1.15rem;text-align:center;color:var(--steel);border:3px solid var(--steel);border-radius:12px;padding:6px 10px;background:#fff;margin:0 auto 10px;max-width:520px}
.tb-flow{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;gap:0;margin:8px 0}
.tb-flow .c{background:#fff;border:2px solid var(--steel);border-radius:10px;padding:6px 10px;font-size:.92rem;max-width:190px;text-align:center}
.tb-flow .a{display:flex;align-items:center;padding:0 6px;color:var(--rust);font-weight:800;font-size:1.3rem}
.tb-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:8px 0}
.tb-card{background:#fff;border:2px solid var(--steel);border-radius:10px;padding:8px 10px;font-size:.92rem}
.tb-card h4{margin:-8px -10px 6px;padding:5px 10px;background:var(--steel);color:#fff;border-radius:7px 7px 0 0;font-size:.95rem}
.tb-card.r{border-color:var(--rust)} .tb-card.r h4{background:var(--rust)}
.tb-card.g{border-color:var(--ok)} .tb-card.g h4{background:var(--ok)}
.tb-card ul{margin:0;padding-left:1.1em}
.tb-vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.tb-vs .mid{font-weight:800;font-size:1.6rem;color:var(--rust);text-align:center}
.tb-key{margin-top:8px;border:2px dashed var(--rust);border-radius:10px;padding:6px 10px;background:#fff8f3;font-size:.95rem}
.tb *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media (max-width:760px){.hs-wrap{grid-template-columns:1fr}.tb-vs{grid-template-columns:1fr}.tb-vs .mid{transform:rotate(90deg)}}
/* Bild */
figure.pic{margin:10px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
figure.pic img{display:block;width:100%;height:auto}
.ph{padding:18px;background:repeating-linear-gradient(45deg,#f1ebe0,#f1ebe0 12px,#ebe3d5 12px,#ebe3d5 24px);min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.ph b{color:var(--steel)}
figure.pic figcaption{font-size:.85rem;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line)}
/* Diagramm */
.chart{border:1px solid var(--line);border-radius:12px;padding:14px 14px 8px;background:#fff;margin:10px 0}
.chart h3{margin:0 0 2px;font-size:1.05rem}
.chart .unit{font-size:.85rem;color:var(--muted);margin:0 0 10px}
.plot{position:relative;height:260px;display:flex;align-items:flex-end;gap:6px;padding:0 4px 0 44px;border-bottom:2px solid var(--ink)}
.grid{position:absolute;left:44px;right:0;border-top:1px dashed #ccc;font-size:.72rem;color:var(--muted)}
.grid span{position:absolute;left:-44px;top:-.7em;width:40px;text-align:right}
.col{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;z-index:1;min-width:0}
.col .v{font-size:.74rem;font-weight:700;margin-bottom:2px;white-space:nowrap}
.col .b{width:72%;max-width:56px;background:var(--steel);border-radius:5px 5px 0 0;transition:height .8s ease;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.col.hl .b{background:var(--rust)}
.xl{display:flex;gap:6px;padding:4px 4px 0 44px}
.xl span{flex:1 1 0;text-align:center;font-size:.78rem;min-width:0}
.src{font-size:.8rem;color:var(--muted);margin:8px 0 0}
table.data{border-collapse:collapse;margin:8px 0;font-size:.92rem}
table.data td,table.data th{border:1px solid var(--line);padding:4px 10px;text-align:right}
table.data th{background:var(--steel-2)}
.steps{display:grid;gap:10px;margin-top:10px}
.step{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.step b{color:var(--steel)}
textarea{width:100%;min-height:70px;font:inherit;border:1px solid #bdb2a0;border-radius:8px;padding:8px;margin-top:6px;background:#fffef9}
.model{display:none;margin-top:6px;background:var(--ok-bg);border-radius:8px;padding:8px 10px;font-size:.95rem}
.model.show{display:block}
/* Quiz */
.q{margin:12px 0 16px}
.q p{margin:0 0 6px;font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;min-height:46px}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.q .ex{font-size:.93rem;margin-top:6px;color:var(--muted)}
/* Sortieren / Ordnen / Paare */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:54px;padding:10px;border:2px dashed var(--line);border-radius:12px;background:#faf6ee}
.item{border:2px solid var(--steel);background:#fff;border-radius:10px;padding:8px 12px;min-height:44px;text-align:left}
.item.sel{background:var(--sel);border-color:var(--rust);box-shadow:0 0 0 3px rgba(164,68,28,.25)}
.item.ok{background:var(--ok-bg);border-color:var(--ok)}
.item.bad{background:var(--bad-bg);border-color:var(--bad)}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:12px}
.zone{border:2px solid var(--steel);border-radius:12px;background:#fff;display:flex;flex-direction:column}
.zone .zh{border:0;border-bottom:2px solid var(--steel);background:var(--steel-2);border-radius:10px 10px 0 0;padding:10px;font-weight:700;min-height:48px;text-align:center}
.zone .zl{display:flex;flex-direction:column;gap:6px;padding:10px;min-height:70px}
.hint{font-size:.88rem;color:var(--muted);margin:4px 0}
ol.seq{margin:10px 0;padding:10px 10px 10px 2.2em;border:2px solid var(--steel);border-radius:12px;min-height:60px;background:#fff}
ol.seq li{margin:4px 0}
ol.seq .item{width:100%}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pairs .colp{display:flex;flex-direction:column;gap:8px}
.item .pn{display:inline-block;background:var(--ok);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;font-size:.8rem;line-height:22px;margin-right:6px}
/* Lückentext */
.gap{font:inherit;font-size:.95rem;border:2px solid var(--steel);border-radius:8px;padding:3px 4px;margin:2px 0;background:#fff;max-width:100%}
.gap.ok{border-color:var(--ok);background:var(--ok-bg)}
.gap.bad{border-color:var(--bad);background:var(--bad-bg)}
.gaptext{line-height:2.1}
/* Karte */
.mapwrap{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
.map{position:relative;width:100%;border:2px solid var(--steel);border-radius:12px;background:linear-gradient(160deg,#eef3e6,#e6eddc);overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.map .ln{position:absolute;height:5px;border-radius:3px;transform-origin:0 50%;opacity:.95}
.map .ln.off{opacity:.12}
.pt{position:absolute;--d:14px;transform:translate(calc(var(--d) / -2),-50%);border:0;background:none;padding:0;display:flex;align-items:center;gap:4px;z-index:3}
.pt i{display:block;width:var(--d);height:var(--d);border-radius:50%;background:#fff;border:3px solid var(--ink);flex:0 0 auto}
.pt.ind{--d:18px}.pt.ind i{background:var(--rust);border-color:#5a220b}
.pt.home i{background:#f2c200;border-color:#6b5500}
.pt span{font-size:.74rem;font-weight:700;background:rgba(255,255,255,.85);padding:0 4px;border-radius:4px;white-space:nowrap}
.pt.left{flex-direction:row-reverse;transform:translate(calc(-100% + var(--d) / 2),-50%)}
.pt.act span{background:var(--sel);outline:2px solid var(--rust)}
.map .note{position:absolute;right:8px;bottom:6px;font-size:.7rem;color:var(--muted)}
.map .nord{position:absolute;left:8px;top:6px;font-size:.8rem;font-weight:700;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:6px}
.legend .btn{display:flex;align-items:center;gap:8px;text-align:left}
.legend .sw{width:26px;height:6px;border-radius:3px;flex:0 0 auto}
.info{min-height:110px}
/* Hefteintrag */
.heft{background:#fff;background-image:repeating-linear-gradient(#fff 0 31px,#cfdcec 31px 32px);border:1px solid #c7d4e4;border-left:4px solid #d9534f;border-radius:6px;padding:14px 18px 14px 26px;line-height:32px;font-family:"Segoe Print","Bradley Hand","Comic Sans MS",cursive,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.heft h3{margin:0;font-size:1.2rem;line-height:32px;text-decoration:underline}
.heft ul,.heft ol{margin:0;padding-left:1.3em}
.heft p{margin:0}
.heft .arrow{color:var(--rust);font-weight:700}
.tbl2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.modal .card{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:18px 20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal h3{margin:0 0 8px;color:var(--steel)}
.fab{position:fixed;right:14px;bottom:14px;z-index:40;border:0;background:var(--rust);color:#fff;border-radius:999px;padding:12px 18px;min-height:50px;box-shadow:0 4px 14px rgba(0,0,0,.25);display:none}
.fab.on{display:block}
footer{color:var(--muted);font-size:.85rem;padding:10px 0 40px}
@media (max-width:760px){.lead,.twocol,.mapwrap,.tbl2{grid-template-columns:1fr}.pairs{grid-template-columns:1fr}section.station{padding:14px}}
@media print{
  body{background:#fff;font-size:12pt}
  nav.path,.tools,.fab,.modal,.btn,.no-print{display:none!important}
  section.station{box-shadow:none;break-inside:avoid-page;border:1px solid #999}
  header.top{background:#fff;color:#000;border-bottom:3px solid #000}
  .model{display:block}
  body.print-he section.station:not(.he), body.print-he header.top, body.print-he .lead, body.print-he footer{display:none!important}
}
</style>
</head>

<header class="top"><div class="wrap" id="hdr"></div></header>

function markDone(i){
  done.add(i);
  const c = document.querySelector('.chip[data-i="'+i+'"]'); if (c) c.classList.add('done');
  const n = D.stationen.length;
  document.getElementById('pbar').style.width = (100*done.size/n)+'%';
  document.getElementById('ptxt').textContent = done.size+' / '+n+' Stationen';
}

/* ---------- Bausteine ---------- */
function picture(key){
  const p = (D.bilder||{})[key]; if (!p) return '';
  const ph = '<div class="ph"><b>Bildimpuls: '+esc(p.titel)+'</b><span>'+esc(p.vorschlag)+'</span></div>';
  const inner = p.src ? '<img src="'+esc(p.src)+'" alt="'+esc(p.alt||p.titel)+'" loading="lazy" data-fallback="1">' : ph;
  return '<figure class="pic">'+inner+(p.src?'<template>'+ph+'</template>':'')+'<figcaption>'+(p.ki?'<span class="ki">KI-BILD</span>':'')+esc(p.caption||p.titel)+'</figcaption></figure>';
}
function pictures(b){ return Array.isArray(b) ? '<div class="gallery">'+b.map(picture).join('')+'</div>' : picture(b); }
function quizHTML(qs, prefix){
  return qs.map((q,qi) => {
    const order = shuffle(q.a.map((a,ai)=>ai));
    return '<div class="q" data-q="'+prefix+'-'+qi+'"><p>'+(qi+1)+'. '+gl(q.f)+'</p><div class="opts">'+
      order.map(ai => '<button type="button" class="opt" data-ok="'+(ai===q.r?1:0)+'">'+esc(q.a[ai])+'</button>').join('')+
      '</div><div class="ex" hidden>'+esc(q.e||'')+'</div></div>';
  }).join('');
}
function chartHTML(c){
  const max = c.max || Math.max(...c.werte.map(w=>w[1]));
  const ticks = c.ticks || 4;
  let grid = '';
  for (let t=1;t<=ticks;t++){ const v = max*t/ticks; grid += '<div class="grid" style="bottom:'+(100*t/ticks)+'%"><span>'+fmt(Math.round(v*10)/10)+'</span></div>'; }
  const cols = c.werte.map(w => '<div class="col'+(w[2]?' hl':'')+'"><span class="v">'+fmt(w[1])+'</span><div class="b" data-h="'+(100*w[1]/max)+'" style="height:0"></div></div>').join('');
  const xl = c.werte.map(w => '<span>'+esc(w[0])+'</span>').join('');
  const tbl = '<table class="data"><tr><th>'+esc(c.xname||'Jahr')+'</th>'+c.werte.map(w=>'<th>'+esc(w[0])+'</th>').join('')+'</tr><tr><td>'+esc(c.einheit)+'</td>'+c.werte.map(w=>'<td>'+fmt(w[1])+'</td>').join('')+'</tr></table>';
  return '<div class="chart"><h3>'+esc(c.titel)+'</h3><p class="unit">'+esc(c.einheit)+'</p><div class="plot">'+grid+cols+'</div><div class="xl">'+xl+'</div>'+
    '<div class="tools no-print"><button type="button" class="btn small" data-act="tbl">Werte als Tabelle</button></div><div class="tblbox" hidden>'+tbl+'</div>'+
    '<p class="src">'+esc(c.quelle)+'</p></div>';
}
function stepsHTML(steps){
  return '<div class="steps">'+steps.map(s => '<div class="step"><b>'+esc(s.t)+'</b> – '+gl(s.f)+'<textarea aria-label="'+esc(s.t)+'" placeholder="Deine Antwort …"></textarea><button type="button" class="btn small" data-act="model">Musterlösung zeigen</button><div class="model">'+gl(s.m)+'</div></div>').join('')+'</div>';
}

/* ---------- Stationen rendern ---------- */
const TYPE = {text:'Info',diagramm:'Diagramm',sortieren:'Ordnen',reihe:'Reihenfolge',paare:'Zuordnen',karte:'Karte',quiz:'Quiz',luecke:'Lückentext',schreiben:'Untersuchen',heft:'Hefteintrag',bildwahl:'Bildquiz',hotspot:'Bild erkunden'};
function render(){
  document.title = D.titel;
  document.getElementById('hdr').innerHTML = '<p class="kicker">Geschichte · Klasse '+esc(D.klasse)+' · '+esc(D.reihe)+'</p><h1>'+esc(D.titel)+'</h1><p class="meta">'+esc(D.untertitel||'')+'</p>';
  const lead = document.createElement('div'); lead.className = 'lead';
  lead.innerHTML = '<div class="box leitfrage"><b>Leitfrage</b>'+gl(D.leitfrage)+'</div><div class="box"><h3>Das lernst du</h3><ul>'+D.ziele.map(z=>'<li>'+esc(z)+'</li>').join('')+'</ul></div>';
  main.appendChild(lead);
  document.getElementById('navchips').innerHTML = D.stationen.map((s,i)=>'<button type="button" class="chip" data-i="'+i+'">'+(i+1)+' '+esc(s.kurz||s.titel)+'</button>').join('')+'<span class="progress" id="ptxt">0 / '+D.stationen.length+' Stationen</span>';
  D.stationen.forEach((s,i) => main.appendChild(buildStation(s,i)));
  document.getElementById('foot').innerHTML = esc(D.fusszeile||'');
  afterBuild(main);
}
function afterBuild(root){
  root.querySelectorAll('img[data-fallback]').forEach(img => img.addEventListener('error', () => {
    const tpl = img.parentNode.querySelector('template'); if (tpl) img.outerHTML = tpl.innerHTML;
  }));
  root.querySelectorAll('section.station[data-typ="hotspot"]').forEach(sec => hsNext(sec));
  root.querySelectorAll('section.station[data-typ="karte"]').forEach(sec => drawLines(sec, D.stationen[+sec.dataset.i].karte));
  requestAnimationFrame(() => setTimeout(() => root.querySelectorAll('.col .b').forEach(b => b.style.height = b.dataset.h+'%'), 60));
}
function buildStation(s,i){
    const sec = document.createElement('section');
    sec.className = 'station' + (s.typ==='heft' ? ' he' : '');
    sec.id = 'st'+i; sec.dataset.i = i; sec.dataset.typ = s.typ;
    let h = '<div class="st-head"><span class="st-nr">'+(i+1)+'</span><h2>'+esc(s.titel)+'</h2><span class="st-type">'+(TYPE[s.typ]||'')+'</span></div>';
    const body = s.text ? '<div class="readable">'+gl(s.text)+'</div>' : '';
    const pic = s.bild ? pictures(s.bild) : '';
    h += (pic && body && !Array.isArray(s.bild)) ? '<div class="twocol"><div>'+body+'</div><div>'+pic+'</div></div>' : body+pic;
    h += '<div class="tools"><button type="button" class="btn small" data-act="read">🔊 Vorlesen</button><button type="button" class="btn small" data-act="stop">Stopp</button></div>';
    if (s.aufgabe) h += '<div class="task">'+gl(s.aufgabe)+'</div>';
    switch (s.typ){
      case 'text':
        h += '<div class="tools"><button type="button" class="btn primary" data-act="gelesen">Gelesen – weiter</button></div>'; break;
      case 'diagramm':
        h += chartHTML(s.diagramm);
        if (s.schritte) h += stepsHTML(s.schritte);
        if (s.fragen) h += '<h3>Prüfe dich</h3>'+quizHTML(s.fragen,'d'+i);
        break;
      case 'quiz':
        h += quizHTML(s.fragen,'q'+i); h += '<p class="fb" aria-live="polite"></p>'; break;
      case 'sortieren':
        h += '<p class="hint">Tippe zuerst eine Karte an, dann die passende Spalte.</p><div class="pool">'+
          shuffle(s.karten.map((k,ki)=>ki)).map(ki=>'<button type="button" class="item" data-k="'+ki+'" data-c="'+s.karten[ki][1]+'">'+gl(esc(s.karten[ki][0]))+'</button>').join('')+'</div>'+
          '<div class="zones">'+s.spalten.map((z,zi)=>'<div class="zone" data-z="'+zi+'"><button type="button" class="zh" data-act="zone">'+esc(z)+'</button><div class="zl"></div></div>').join('')+'</div>'+
          '<div class="tools"><button type="button" class="btn primary" data-act="checksort">Überprüfen</button><button type="button" class="btn" data-act="reset">Neu mischen</button></div><p class="fb" aria-live="polite"></p>';
        break;
      case 'reihe':
        h += '<p class="hint">Tippe die Karten in der richtigen Reihenfolge an. Antippen in der Liste legt eine Karte zurück.</p><div class="pool">'+
          shuffle(s.karten.map((k,ki)=>ki)).map(ki=>'<button type="button" class="item" data-k="'+ki+'">'+esc(s.karten[ki])+'</button>').join('')+'</div><ol class="seq"></ol>'+
          '<div class="tools"><button type="button" class="btn primary" data-act="checkseq">Überprüfen</button><button type="button" class="btn" data-act="reset">Neu mischen</button><button type="button" class="btn" data-act="solseq">Lösung zeigen</button></div><p class="fb" aria-live="polite"></p>';
        break;
      case 'paare':
        h += '<p class="hint">Tippe links eine Karte an und dann rechts die passende.</p><div class="pairs"><div class="colp">'+
          shuffle(s.paare.map((p,pi)=>pi)).map(pi=>'<button type="button" class="item" data-side="l" data-p="'+pi+'">'+esc(s.paare[pi][0])+'</button>').join('')+'</div><div class="colp">'+
          shuffle(s.paare.map((p,pi)=>pi)).map(pi=>'<button type="button" class="item" data-side="r" data-p="'+pi+'">'+esc(s.paare[pi][1])+'</button>').join('')+'</div></div>'+
          '<div class="tools"><button type="button" class="btn" data-act="reset">Neu mischen</button></div><p class="fb" aria-live="polite"></p>';
        break;
      case 'luecke': {
        let n = 0;
        const t = s.lueckentext.replace(/\[\[([^\]]+)\]\]/g, (m, inner) => {
          const opts = inner.split('|'); const right = opts[0];
          return '<select class="gap" data-r="'+esc(right)+'" aria-label="Lücke '+(++n)+'"><option value="">…</option>'+shuffle(opts).map(o=>'<option>'+esc(o)+'</option>').join('')+'</select>';
        });
        h += '<div class="gaptext">'+t+'</div><div class="tools"><button type="button" class="btn primary" data-act="checkgap">Überprüfen</button></div><p class="fb" aria-live="polite"></p>';
        break; }
      case 'karte':
        h += '<div class="mapwrap"><div><div class="map" style="aspect-ratio:'+(s.karte.ratio||1.2)+'"><span class="nord">↑ N</span><span class="note">'+esc(s.karte.hinweis||'Schematische Skizze, nicht maßstabsgetreu')+'</span>'+
          s.karte.orte.map((o,oi)=>'<button type="button" class="pt'+(o.art?' '+o.art:'')+(o.links?' left':'')+'" style="left:'+o.x+'%;top:'+o.y+'%" data-o="'+oi+'"><i></i><span>'+esc(o.n)+'</span></button>').join('')+
          '</div></div><div><div class="legend">'+(s.karte.linien||[]).map((l,li)=>'<button type="button" class="btn small" data-act="line" data-l="'+li+'" aria-pressed="true"><span class="sw" style="background:'+l.farbe+'"></span>'+esc(l.name)+'</button>').join('')+
          '</div><div class="box info" aria-live="polite" style="margin-top:10px"><b>Tippe auf einen Ort.</b></div></div></div>';
        if (s.fragen) h += '<h3>Karte auswerten</h3>'+quizHTML(s.fragen,'k'+i);
        break;
      case 'bildwahl':
        h += D.stationen[i].fragen.map((q,qi) => {
          const order = shuffle(q.a.map((a,ai)=>ai));
          return '<div class="q" data-q="b'+i+'-'+qi+'"><p>'+(qi+1)+'. '+gl(q.f)+'</p><div class="bopts">'+order.map(ai => { const b = D.bilder[q.a[ai]]||{};
            return '<button type="button" class="opt bopt" data-ok="'+(ai===q.r?1:0)+'"><img src="'+esc(b.src||'')+'" alt="'+esc(b.alt||b.titel||'')+'" loading="lazy"><span>'+esc(b.kurz||b.titel||'')+'</span></button>'; }).join('')+'</div><div class="ex" hidden>'+esc(q.e||'')+'</div></div>';
        }).join('') + '<p class="fb" aria-live="polite"></p>';
        break;
      case 'hotspot': {
        const b = D.bilder[s.hotspot.bild]||{};
        h += '<div class="hs-wrap"><div><div class="hs" role="img" aria-label="'+esc(b.alt||'')+'"><img src="'+esc(b.src||'')+'" alt="'+esc(b.alt||'')+'" draggable="false"></div><p class="hint">'+(b.ki?'<span class="ki">KI-BILD</span>':'')+esc(b.caption||'')+'</p></div>'+
          '<div><p class="hs-find" aria-live="polite"></p><div class="hs-list">'+s.hotspot.ziele.map((z,zi)=>'<button type="button" class="item" data-z="'+zi+'">'+esc(z.n)+'</button>').join('')+'</div>'+
          '<div class="tools"><button type="button" class="btn small" data-act="hstip">Tipp zeigen</button><button type="button" class="btn small" data-act="reset">Neu starten</button></div><p class="fb" aria-live="polite"></p><div class="box info" hidden></div></div></div>';
        break; }
      case 'schreiben':
        h += stepsHTML(s.felder) + '<div class="tools"><button type="button" class="btn primary" data-act="fertig">Fertig bearbeitet</button><button type="button" class="btn" data-act="print">Station drucken</button></div>';
        break;
      case 'heft':
        h += '<div class="heft">'+s.heft+'</div><div class="tools"><button type="button" class="btn primary" data-act="heftok">Ins Heft übertragen ✓</button><button type="button" class="btn" data-act="printhe">Nur Hefteintrag drucken</button></div>';
        break;
    }
    sec.innerHTML = h;
    return sec;
}

/* ---------- Hotspot ---------- */
function hsNext(sec, want){
  const S = D.stationen[+sec.dataset.i], its = sec.querySelectorAll('.hs-list .item');
  let cur = want;
  if (cur === undefined) { cur = -1; for (let k=0;k<its.length;k++){ if(!its[k].classList.contains('ok')){ cur=k; break; } } }
  sec.dataset.cur = cur;
  its.forEach((x,k)=>x.classList.toggle('cur', k===cur));
  sec.querySelector('.hs-find').textContent = cur >= 0 ? 'Finde im Bild: '+S.hotspot.ziele[cur].n : 'Alles gefunden!';
}
function hsMark(sec, z, cls, label){
  const m = document.createElement('div'); m.className = 'mark'+(cls?' '+cls:'');
  m.style.cssText = 'left:'+z.x+'%;top:'+z.y+'%;width:'+z.w+'%;height:'+z.h+'%';
  if (label) m.innerHTML = '<span>'+esc(label)+'</span>';
  sec.querySelector('.hs').appendChild(m); return m;
}
document.addEventListener('pointerdown', e => {
  const hs = e.target.closest('.hs'); if (!hs) return;
  const sec = hs.closest('section.station'), S = D.stationen[+sec.dataset.i], cur = +sec.dataset.cur; if (cur < 0) return;
  const r = hs.getBoundingClientRect(), px = (e.clientX-r.left)/r.width*100, py = (e.clientY-r.top)/r.height*100;
  const z = S.hotspot.ziele[cur], fb = sec.querySelector('.fb');
  if (px>=z.x && px<=z.x+z.w && py>=z.y && py<=z.y+z.h){
    sec.querySelectorAll('.mark.tip').forEach(x=>x.remove());
    hsMark(sec, z, '', z.n);
    const it = sec.querySelectorAll('.hs-list .item')[cur]; it.classList.add('ok');
    const info = sec.querySelector('.info'); info.hidden = false; info.innerHTML = '<b>'+esc(z.n)+'</b><p style="margin:.3em 0 0">'+gl(esc(z.info||''))+'</p>';
    fb.textContent = 'Gefunden!'; fb.className = 'fb ok';
    hsNext(sec);
    if (+sec.dataset.cur < 0) { fb.textContent = 'Super – du hast alle '+S.hotspot.ziele.length+' Details gefunden!'; markDone(+sec.dataset.i); }
  } else {
    const d = document.createElement('div'); d.className = 'dot'; d.style.left = px+'%'; d.style.top = py+'%'; hs.appendChild(d); setTimeout(()=>d.remove(), 1000);
    fb.textContent = 'Nicht ganz – suche weiter.'; fb.className = 'fb bad';
  }
});

/* ---------- Karte: Linien zwischen Orten ---------- */
function drawLines(sec, k){
  const map = sec.querySelector('.map');
  const idx = {}; k.orte.forEach((o,oi)=> idx[o.n] = o);
  function place(){
    map.querySelectorAll('.ln').forEach(x=>x.remove());
    const W = map.clientWidth, H = map.clientHeight; if (!W || !H) return;
    (k.linien||[]).forEach((l,li) => {
      for (let j=0;j<l.halte.length-1;j++){
        const a = idx[l.halte[j]], b = idx[l.halte[j+1]]; if (!a || !b) continue;
        const x1=a.x*W/100, y1=a.y*H/100, x2=b.x*W/100, y2=b.y*H/100;
        const len = Math.hypot(x2-x1,y2-y1), ang = Math.atan2(y2-y1,x2-x1)*180/Math.PI;
        const d = document.createElement('div'); d.className = 'ln'; d.dataset.l = li;
        d.style.cssText = 'left:'+x1+'px;top:'+(y1-2.5)+'px;width:'+len+'px;transform:rotate('+ang+'deg);background:'+l.farbe;
        const btn = sec.querySelector('[data-act="line"][data-l="'+li+'"]');
        if (btn && btn.getAttribute('aria-pressed')==='false') d.classList.add('off');
        map.insertBefore(d, map.firstChild);
      }
    });
  }
  place();
  if ('ResizeObserver' in window) new ResizeObserver(place).observe(map); else window.addEventListener('resize', place);
}

/* ---------- Interaktion (Event-Delegation) ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, .gl'); if (!t) return;
  if (t.classList.contains('gl')) { openGloss(t.dataset.term); return; }
  if (t.classList.contains('chip')) { document.getElementById('st'+t.dataset.i).scrollIntoView(); return; }
  const act = t.dataset.act;
  if (act === 'stop') { stopSpeak(); return; }
  if (act === 'mclose') { closeModal(); return; }
  if (act === 'mread') { speakText(document.getElementById('mTitle').innerText+'. '+document.getElementById('mBody').innerText); return; }
  const sec = t.closest('section.station'); if (!sec) return;
  const i = +sec.dataset.i, S = D.stationen[i], fb = sec.querySelector('.fb');
  const say = (msg, ok) => { if (fb){ fb.textContent = msg; fb.className = 'fb '+(ok?'ok':'bad'); } };

  if (act === 'read') return readSection(sec);
  if (act === 'gelesen' || act === 'fertig' || act === 'heftok') { markDone(i); t.textContent = '✓ erledigt'; return; }
  if (act === 'print') { window.print(); return; }
  if (act === 'printhe') { document.body.classList.add('print-he'); window.print(); setTimeout(()=>document.body.classList.remove('print-he'), 500); return; }
  if (act === 'tbl') { const b = t.closest('.chart').querySelector('.tblbox'); b.hidden = !b.hidden; t.textContent = b.hidden ? 'Werte als Tabelle' : 'Tabelle ausblenden'; return; }
  if (act === 'model') { const m = t.nextElementSibling; m.classList.toggle('show'); t.textContent = m.classList.contains('show') ? 'Musterlösung ausblenden' : 'Musterlösung zeigen'; return; }

  // Quiz-Optionen
  if (t.classList.contains('opt')) {
    const q = t.closest('.q'); if (q.dataset.solved) return;
    if (t.dataset.ok === '1') {
      t.classList.add('ok'); q.dataset.solved = '1';
      const ex = q.querySelector('.ex'); if (ex.textContent) ex.hidden = false;
      if (!q.dataset.miss) q.dataset.first = '1';
      const all = sec.querySelectorAll('.q'), sol = sec.querySelectorAll('.q[data-solved]');
      if (all.length === sol.length) {
        const first = sec.querySelectorAll('.q[data-first]').length;
        say('Alle Fragen gelöst! Beim ersten Versuch richtig: '+first+' von '+all.length+'.', true);
        markDone(i);
      }
    } else { t.classList.add('bad'); q.dataset.miss = '1'; }
    return;
  }

  if (S.typ === 'hotspot') {
    if (t.classList.contains('item') && !t.classList.contains('ok')) { hsNext(sec, +t.dataset.z); return; }
    if (act === 'hstip') { const cur = +sec.dataset.cur; if (cur >= 0) { const m = hsMark(sec, S.hotspot.ziele[cur], 'tip'); setTimeout(()=>m.remove(), 1600); } return; }
  }
  // Sortieren
  if (S.typ === 'sortieren') {
    if (t.classList.contains('item')) {
      sec.querySelectorAll('.item.sel').forEach(x=>{ if (x!==t) x.classList.remove('sel'); });
      t.classList.toggle('sel'); t.classList.remove('ok','bad'); return;
    }
    if (act === 'zone') {
      const s = sec.querySelector('.item.sel'); if (!s) { say('Tippe zuerst eine Karte an.', false); return; }
      s.classList.remove('sel'); t.parentNode.querySelector('.zl').appendChild(s); say('', true); return;
    }
    if (act === 'checksort') {
      const pool = sec.querySelector('.pool').children.length;
      let ok = 0, n = 0;
      sec.querySelectorAll('.zone').forEach(z => z.querySelectorAll('.item').forEach(it => { n++; const r = it.dataset.c === z.dataset.z; it.classList.toggle('ok', r); it.classList.toggle('bad', !r); if (r) ok++; }));
      if (pool) say(ok+' von '+n+' richtig einsortiert. Es liegen noch '+pool+' Karten oben.', false);
      else if (ok === n) { say('Hervorragend – alles richtig zugeordnet!', true); markDone(i); }
      else say(ok+' von '+n+' richtig. Rote Karten noch einmal verschieben.', false);
      return;
    }
  }
  // Reihenfolge
  if (S.typ === 'reihe') {
    const pool = sec.querySelector('.pool'), seq = sec.querySelector('.seq');
    if (t.classList.contains('item')) {
      t.classList.remove('ok','bad');
      if (t.parentNode === pool) { const li = document.createElement('li'); li.appendChild(t); seq.appendChild(li); }
      else { const li = t.parentNode; pool.appendChild(t); li.remove(); }
      return;
    }
    if (act === 'checkseq') {
      const its = seq.querySelectorAll('.item'); let ok = 0;
      its.forEach((it,pos) => { const r = +it.dataset.k === pos; it.classList.toggle('ok', r); it.classList.toggle('bad', !r); if (r) ok++; });
      if (its.length < S.karten.length) say('Lege zuerst alle Karten in die Liste.', false);
      else if (ok === its.length) { say('Richtig! Die Reihenfolge stimmt.', true); markDone(i); }
      else say(ok+' von '+its.length+' an der richtigen Stelle.', false);
      return;
    }
    if (act === 'solseq') {
      seq.innerHTML = ''; pool.innerHTML = '';
      S.karten.forEach((k,ki) => { const li = document.createElement('li'); li.innerHTML = '<button type="button" class="item ok" data-k="'+ki+'">'+esc(k)+'</button>'; seq.appendChild(li); });
      say('Das ist die richtige Reihenfolge. Lies sie dir genau durch.', true); return;
    }
  }
  // Paare
  if (S.typ === 'paare' && t.classList.contains('item')) {
    if (t.disabled) return;
    if (t.dataset.side === 'l') { sec.querySelectorAll('.item[data-side="l"]').forEach(x=>x.classList.remove('sel','bad')); t.classList.add('sel'); return; }
    const l = sec.querySelector('.item.sel[data-side="l"]'); if (!l) { say('Tippe zuerst links eine Karte an.', false); return; }
    if (l.dataset.p === t.dataset.p) {
      const n = sec.querySelectorAll('.item.ok[data-side="l"]').length + 1;
      [l,t].forEach(x => { x.classList.remove('sel','bad'); x.classList.add('ok'); x.disabled = true; x.insertAdjacentHTML('afterbegin','<span class="pn">'+n+'</span>'); });
      if (n === S.paare.length) { say('Alle Paare gefunden!', true); markDone(i); } else say('Richtig!', true);
    } else { t.classList.add('bad'); setTimeout(()=>t.classList.remove('bad'), 700); say('Passt nicht – versuche es noch einmal.', false); }
    return;
  }
  // Lückentext
  if (act === 'checkgap') {
    const g = sec.querySelectorAll('.gap'); let ok = 0;
    g.forEach(x => { const r = x.value === x.dataset.r; x.classList.toggle('ok', r); x.classList.toggle('bad', !r); if (r) ok++; });
    if (ok === g.length) { say('Alles richtig ergänzt!', true); markDone(i); } else say(ok+' von '+g.length+' Lücken richtig.', false);
    return;
  }
  // Karte
  if (t.classList.contains('pt')) {
    const o = S.karte.orte[+t.dataset.o];
    sec.querySelectorAll('.pt.act').forEach(x=>x.classList.remove('act')); t.classList.add('act');
    sec.querySelector('.info').innerHTML = '<b>'+esc(o.n)+'</b><p style="margin:.3em 0 0">'+gl(esc(o.info||''))+'</p>';
    return;
  }
  if (act === 'line') {
    const on = t.getAttribute('aria-pressed') !== 'true';
    t.setAttribute('aria-pressed', on);
    sec.querySelectorAll('.ln[data-l="'+t.dataset.l+'"]').forEach(x=>x.classList.toggle('off', !on));
    const l = S.karte.linien[+t.dataset.l];
    if (on) sec.querySelector('.info').innerHTML = '<b>'+esc(l.name)+'</b><p style="margin:.3em 0 0">'+esc(l.info||'')+'</p>';
    return;
  }
  // Zurücksetzen: Station neu aufbauen
  if (act === 'reset') {
    const fresh = buildStation(S, i);
    sec.replaceWith(fresh); afterBuild(fresh);
    return;
  }
});
window.addEventListener('afterprint', () => document.body.classList.remove('print-he'));
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
render();
})();
</script>
</body>
</html>
