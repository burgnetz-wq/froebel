<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <style>
:root {
  color-scheme: dark;
  --bg: #101416;
  --panel: rgba(13, 18, 21, .72);
  --text: #f5f1e8;
  --muted: #d8d1c2;
  --accent: #d6a45e;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; }
body {
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.page {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: grid;
  place-items: center;
}
.fade-in { animation: fadeIn .9s ease both; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.progress {
  position: fixed;
  left: 0;
  bottom: 0;
  height: 5px;
  width: 100%;
  background: rgba(255,255,255,.12);
  z-index: 5;
}
.progress::after {
  content: "";
  display: block;
  width: 100%;
  height: 100%;
  background: var(--accent);
  transform-origin: left center;
  animation: countdown 7s linear forwards;
}
@keyframes countdown { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.counter {
  position: fixed;
  right: 18px;
  top: 16px;
  z-index: 6;
  padding: .38rem .66rem;
  border-radius: 999px;
  background: rgba(0,0,0,.48);
  color: rgba(255,255,255,.88);
  font-size: clamp(.78rem, 1.2vw, .95rem);
  letter-spacing: .04em;
  backdrop-filter: blur(7px);
}
.navhint {
  position: fixed;
  left: 16px;
  bottom: 16px;
  z-index: 6;
  font-size: .78rem;
  color: rgba(255,255,255,.62);
  background: rgba(0,0,0,.34);
  padding: .32rem .52rem;
  border-radius: .45rem;
}
@media (pointer: coarse), (max-width: 700px) { .navhint { display:none; } }
</style>
</head>
<body>

<main class="page fade-in title-page" aria-label="Titelseite">
  <div class="title-bg" aria-hidden="true"></div>
  <section class="title-card">
    <p class="kicker">Kunstprojekt</p>
    <h1>Projekt Ölmalerei</h1>
    <h2>Nass-in-Nass-Technik</h2>
    <p class="subtitle">Alpines mit Hahn</p>
  </section>
  <div class="counter">1 / 11</div>
</main>
<style>
.title-page { isolation: isolate; padding: 6vw; }
.title-bg {
  position: absolute; inset: 0; z-index: -2;
  background:
    radial-gradient(circle at center, rgba(8,15,18,.18), rgba(8,15,18,.68)),
    url("bilder/bild_01.jpg") center/contain no-repeat;
  background-color: #101416; filter: saturate(.9) brightness(.8);
  transform: scale(1.03);
}
.title-bg::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(circle at 70% 20%, transparent 0 16%, rgba(0,0,0,.48) 72%);
}
.title-card {
  width: min(860px, 88vw);
  padding: clamp(1.8rem, 5vw, 4.5rem);
  border: 1px solid rgba(255,255,255,.22);
  background: var(--panel);
  box-shadow: 0 28px 80px rgba(0,0,0,.45);
  backdrop-filter: blur(9px);
}
.kicker { margin: 0 0 .8rem; text-transform: uppercase; letter-spacing: .26em; color: var(--accent); font-weight: 700; }
h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2.6rem, 8vw, 7rem); line-height: .98; font-weight: 700; }
h2 { margin: .7rem 0 0; font-size: clamp(1.35rem, 3.2vw, 2.9rem); font-weight: 450; color: var(--muted); }
.subtitle { margin: 2rem 0 0; font-size: clamp(1.2rem, 2.5vw, 2rem); color: #fff; }
</style>

  <div class="progress" aria-hidden="true"></div>
  <div class="navhint">← zurück · → weiter · P pausiert</div>

<script>
  const nextPage = '02_bild_01.html';
  const previousPage = '11_bild_10.html';
  const delay = 7000;
  let timer = setTimeout(() => location.href = nextPage, delay);
  document.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowRight' || event.key === ' ' || event.key === 'Enter') {
      clearTimeout(timer); location.href = nextPage;
    }
    if (event.key === 'ArrowLeft') {
      clearTimeout(timer); location.href = previousPage;
    }
    if (event.key.toLowerCase() === 'p') {
      clearTimeout(timer);
      document.querySelector('.progress')?.remove();
    }
  });
</script>

</body>
</html>
