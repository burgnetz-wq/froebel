<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="refresh" content="7;url=03_bild_02.html">
  <title>Projekt Ölmalerei – Bild 1</title>
  <link rel="prefetch" href="03_bild_02.html">
  <link rel="prefetch" href="bilder/bild_02.jpg">
  <style>
:root {
  color-scheme: dark;
  --bg: #101416;
  --panel: rgba(13, 18, 21, .72);
  --text: #f5f1e8;
  --muted: #d8d1c2;
  --accent: #d6a45e;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; }
body {
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.page {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: grid;
  place-items: center;
}
.fade-in { animation: fadeIn .9s ease both; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.progress {
  position: fixed;
  left: 0;
  bottom: 0;
  height: 5px;
  width: 100%;
  background: rgba(255,255,255,.12);
  z-index: 5;
}
.progress::after {
  content: "";
  display: block;
  width: 100%;
  height: 100%;
  background: var(--accent);
  transform-origin: left center;
  animation: countdown 7s linear forwards;
}
@keyframes countdown { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.counter {
  position: fixed;
  right: 18px;
  top: 16px;
  z-index: 6;
  padding: .38rem .66rem;
  border-radius: 999px;
  background: rgba(0,0,0,.48);
  color: rgba(255,255,255,.88);
  font-size: clamp(.78rem, 1.2vw, .95rem);
  letter-spacing: .04em;
  backdrop-filter: blur(7px);
}
.navhint {
  position: fixed;
  left: 16px;
  bottom: 16px;
  z-index: 6;
  font-size: .78rem;
  color: rgba(255,255,255,.62);
  background: rgba(0,0,0,.34);
  padding: .32rem .52rem;
  border-radius: .45rem;
}
@media (pointer: coarse), (max-width: 700px) { .navhint { display:none; } }
</style>
</head>
<body>

<main class="page image-page fade-in">
  <figure>
    <img src="bilder/bild_01.jpg" alt="Ölgemälde: Alpenlandschaft 1">
  </figure>
  <div class="counter">2 / 11</div>
</main>
<style>
.image-page { padding: 0; }
figure {
  margin: 0;
  width: 100vw;
  height: 100vh;
  display: grid;
  place-items: center;
  padding: clamp(54px, 7vh, 74px) clamp(10px, 1.8vw, 24px) clamp(38px, 6vh, 56px);
}
img {
  display: block;
  width: 800px;
  max-width: calc(100vw - 24px);
  max-height: calc(100vh - 120px);
  height: auto;
  object-fit: contain;
  object-position: center center;
  box-shadow: 0 18px 60px rgba(0,0,0,.52);
  border: 1px solid rgba(255,255,255,.14);
  background: #0b0d0e;
}
</style>

  <div class="progress" aria-hidden="true"></div>
  <div class="navhint">← zurück · → weiter · P pausiert</div>

<script>
  const nextPage = '03_bild_02.html';
  const previousPage = 'index.html';
  const delay = 7000;
  let timer = setTimeout(() => location.href = nextPage, delay);
  document.addEventListener('keydown', (event) => {
    if (event.key === 'ArrowRight' || event.key === ' ' || event.key === 'Enter') {
      clearTimeout(timer); location.href = nextPage;
    }
    if (event.key === 'ArrowLeft') {
      clearTimeout(timer); location.href = previousPage;
    }
    if (event.key.toLowerCase() === 'p') {
      clearTimeout(timer);
      document.querySelector('.progress')?.remove();
    }
  });
</script>



</body>
</html>
